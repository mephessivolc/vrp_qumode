services:
  app:
    volumes:
        - .:/workspace:cached
        - /home-ext/clovis:/home-ext/clovis
    user: "${UID:-1025}:${GID:-1025}"
    deploy:
      resources:
        # 2. LIMITES DE CPU E RAM (Impede o container de travar a máquina)
        limits:
          cpus: '8.0' # Limita a 8 núcleos virtuais de CPU
          memory: 32G # Limita a 32 GB de RAM

        # 3. RESERVA DE GPU (Garantia de recursos sem monopolizar)
        reservations:
          devices:
            - driver: nvidia
              count: 1 # Usa apenas 1 GPU (em vez de 'all')
              # Se preferir escolher uma GPU específica que esteja livre (ex: GPU 0):
              # device_ids: ['0'] 
              capabilities: [ gpu ]
